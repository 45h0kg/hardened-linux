# Time sync over Network Time Security (NTS, RFC 8915). Plain NTP is
# unauthenticated: anyone on the path can shift this machine's clock, which
# breaks certificate validity checks, Kerberos, TOTP, log correlation and
# replay protection. NTS authenticates every response with keys from a TLS
# handshake. These operators run public NTS servers.
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
server ptbtime2.ptb.de iburst nts

# Require two agreeing sources before trusting time. A single compromised
# server cannot move the clock alone.
minsources 2

# Keep NTS cookies across restarts so the TLS handshake isn't repeated.
ntsdumpdir /var/lib/chrony

# Do not take time sources from DHCP (an attacker on the LAN controls DHCP).
# The stock "sourcedir /run/chrony-dhcp" line is removed on purpose.

driftfile /var/lib/chrony/drift
# Step the clock only during the first three updates after boot; slew after.
makestep 1.0 3
rtcsync
logdir /var/log/chrony

# No NTP server and no network command port: chronyc talks to chronyd over
# a local Unix socket only.
port 0
cmdport 0
