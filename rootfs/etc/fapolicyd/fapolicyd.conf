# fapolicyd: application allow-listing. Every execve() and every open of an
# interpreted file (Python, shell, Perl...) is checked against a trust
# database built from the RPM database plus /etc/fapolicyd/trust.d. A binary
# an attacker drops in /var/tmp or a home directory does not run, even as
# root. The rules themselves are the shipped defaults in rules.d.
permissive = 0
nice_val = 14
q_size = 1024
uid = fapolicyd
gid = fapolicyd
do_stat_report = 1
detailed_report = 1
db_max_size = 100
subj_cache_size = 4099
obj_cache_size = 8191
watch_fs = ext2,ext3,ext4,tmpfs,xfs,vfat,iso9660,btrfs,overlay,erofs
trust = rpmdb,file
# Compare the SHA-256 of each file against the trust database instead of
# only its size. Costs CPU on first open; catches a trusted binary that
# was modified in place.
integrity = sha256
syslog_format = rule,dec,perm,auid,pid,exe,:,path,ftype,trust
rpm_sha256_only = 0
allow_filesystem_mark = 0
report_interval = 0
