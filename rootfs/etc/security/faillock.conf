# pam_faillock: lock an account after repeated failures. Enabled in the PAM
# stack with `authselect enable-feature with-faillock` in the Containerfile.
# Three failures within 15 minutes lock the account for 15 minutes.
# Locking root too is a deliberate trade-off: an attacker at the console can
# lock root out for 15 minutes, but cannot guess its password at full speed.
dir = /var/run/faillock
audit
silent
deny = 3
fail_interval = 900
unlock_time = 900
even_deny_root
root_unlock_time = 900
