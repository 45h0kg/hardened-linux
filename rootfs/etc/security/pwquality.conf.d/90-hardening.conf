# Password quality, enforced by pam_pwquality when a password is set.
# Network logins are key-only (sshd), so these protect console and sudo.
minlen = 15
minclass = 4
dcredit = -1
ucredit = -1
lcredit = -1
ocredit = -1
maxrepeat = 3
maxclassrepeat = 4
difok = 8
dictcheck = 1
usercheck = 1
enforcing = 1
enforce_for_root
retry = 3
