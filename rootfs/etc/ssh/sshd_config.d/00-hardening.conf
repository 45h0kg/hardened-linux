# sshd hardening. OpenSSH uses the first value it reads for most keywords,
# and the stock sshd_config includes sshd_config.d/*.conf before its own
# settings, so the 00- prefix makes these win.
#
# Ciphers, MACs, key exchange and host key algorithms are deliberately NOT
# set here: they come from the system crypto policy (FUTURE), so sshd,
# OpenSSL, GnuTLS and NSS agree.

# Keys only. No passwords, no keyboard-interactive, no root.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey
HostbasedAuthentication no
IgnoreRhosts yes
GSSAPIAuthentication no

# Only administrators (wheel) may log in over the network.
AllowGroups wheel

# Little to forward means little to abuse after a key is stolen.
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
PermitUserRC no
DisableForwarding yes

# Limit guessing and half-open connections.
MaxAuthTries 3
MaxSessions 2
MaxStartups 10:30:60
LoginGraceTime 30

# Drop idle sessions after 10 minutes.
ClientAliveInterval 300
ClientAliveCountMax 1

# Strict modes on key files, verbose logs (key fingerprints) for auditing.
StrictModes yes
LogLevel VERBOSE
Compression no
UsePAM yes
PrintLastLog yes
Banner /etc/issue
