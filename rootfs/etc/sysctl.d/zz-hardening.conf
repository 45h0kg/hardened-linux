# Kernel tunables, applied by systemd-sysctl at every boot.
#
# Where: /etc/sysctl.d, not /usr/lib/sysctl.d. The STIG remediation in the
# Containerfile writes one file per key into /etc/sysctl.d, and the SCAP
# check for each key requires every file in /etc/sysctl.d that sets it to
# agree. The Containerfile deletes the STIG's per-key files for every key
# set here, so this file is the single source for these values.
#
# Why "zz-": systemd-sysctl sorts every *.conf from /etc, /run and
# /usr/lib/sysctl.d together by file name and applies them in that order,
# so the last file to set a key wins. Digits sort before letters; a file
# called 90-hardening.conf lost to the STIG's kernel_*.conf files, and the
# first build of this image shipped kptr_restrict=1 and ptrace_scope=1
# instead of 2 that way.

## Information leaks
# Hide kernel pointers from everyone, including root, in /proc and printk.
kernel.kptr_restrict = 2
# dmesg readable only with CAP_SYSLOG.
kernel.dmesg_restrict = 1
# Keep kernel messages off the console.
kernel.printk = 3 3 3 3

## Attack surface for local privilege escalation
# No eBPF for unprivileged users (1 = off and cannot be re-enabled until boot).
kernel.unprivileged_bpf_disabled = 1
# Harden the BPF JIT for everyone: constant blinding against JIT spraying.
net.core.bpf_jit_harden = 2
# ptrace only by processes with CAP_SYS_PTRACE (2). 3 would forbid it
# entirely and cannot be undone without a reboot.
kernel.yama.ptrace_scope = 2
# Once booted, no kexec of a new kernel (lockdown already requires signed).
kernel.kexec_load_disabled = 1
# perf events only for CAP_PERFMON/CAP_SYS_ADMIN.
kernel.perf_event_paranoid = 2
# No magic SysRq key.
kernel.sysrq = 0
# Full ASLR.
kernel.randomize_va_space = 2
# io_uring has been the source of many kernel exploits; 2 disables it for
# every process. Some databases and runtimes use it when present and fall
# back to epoll when it is not.
kernel.io_uring_disabled = 2
# userfaultfd lets an exploit pause the kernel mid-copy; root only.
vm.unprivileged_userfaultfd = 0
# Line disciplines are kernel code reachable from a tty; do not autoload them.
dev.tty.ldisc_autoload = 0
# TIOCSTI lets a program push characters into another terminal's input.
dev.tty.legacy_tiocsti = 0
# User namespaces give unprivileged users a root-in-namespace view of many
# kernel interfaces (netfilter, mount, etc.), the precondition for a long
# list of exploits. A server without rootless containers does not need
# them. This also blocks systemd's PrivateUsers= and rootless podman.
user.max_user_namespaces = 0

## Files and core dumps
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# setuid programs never dump core, and nothing dumps core at all.
fs.suid_dumpable = 0
kernel.core_pattern = |/bin/false

## Network (host is not a router)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
# Router advertisements can reconfigure addresses and default routes. Off
# here; a network that relies on SLAAC needs an /etc/sysctl.d override.
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
