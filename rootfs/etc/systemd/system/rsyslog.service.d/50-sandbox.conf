# Sandbox rsyslog. It parses untrusted input (log lines from every program,
# and from the network if a remote input is ever enabled), so a parsing bug
# should not hand an attacker the whole machine. It may read the journal,
# write /var/log and its own state, and open network connections to the
# log server; nothing else.
[Service]
ProtectSystem=strict
ReadWritePaths=/var/log /var/lib/rsyslog /run
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
NoNewPrivileges=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
CapabilityBoundingSet=CAP_SYSLOG CAP_DAC_READ_SEARCH CAP_DAC_OVERRIDE CAP_CHOWN CAP_SETUID CAP_SETGID CAP_NET_BIND_SERVICE
UMask=0077
