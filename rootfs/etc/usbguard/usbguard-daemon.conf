# USBGuard: an allow-list for USB devices. Defends against BadUSB-style
# devices (a "flash drive" that is really a keyboard typing commands) and
# against plugging in storage to copy data off.
RuleFile=/etc/usbguard/rules.conf
RuleFolder=/etc/usbguard/rules.d/
# Anything not explicitly allowed is blocked (the device stays
# unauthorized; its driver is never bound).
ImplicitPolicyTarget=block
# Devices already present at boot and devices plugged in later are both
# checked against the rules. The first-boot unit usbguard-firstboot.service
# writes a rule set that allows the devices present at first boot, so the
# console keyboard keeps working.
PresentDevicePolicy=apply-policy
PresentControllerPolicy=keep
InsertedDevicePolicy=apply-policy
RestoreControllerDeviceState=false
DeviceManagerBackend=uevent
# Only root and wheel may talk to the daemon (list or allow devices).
IPCAllowedUsers=root
IPCAllowedGroups=wheel
IPCAccessControlFiles=/etc/usbguard/IPCAccessControl.d/
DeviceRulesWithPort=false
# Every allow/block decision goes to the Linux audit log.
AuditBackend=LinuxAudit
HidePII=false
