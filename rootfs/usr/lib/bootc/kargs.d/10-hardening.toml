# Kernel command line hardening, applied by bootc at install and on every
# upgrade. bootc merges every file in /usr/lib/bootc/kargs.d/ into the boot
# entry, so the arguments travel with the image instead of living in a
# bootloader config someone has to edit by hand.
#
# Each argument below is explained in docs/controls.md. In short:
kargs = [
  # Kernel lockdown, strictest mode. Root can no longer modify the running
  # kernel (/dev/mem, /dev/kmem, /dev/port, unsigned kexec, MSR writes,
  # ACPI table overrides) nor read kernel memory (kprobes reading arbitrary
  # memory, bpf_probe_read_kernel, /proc/kcore, hibernation images).
  "lockdown=confidentiality",

  # Refuse to load any kernel module that is not signed by a key in the
  # kernel's builtin or secondary keyring. Out-of-tree drivers stop working.
  "module.sig_enforce=1",

  # Zero every page and slab object when it is allocated and again when it
  # is freed. Kills a class of uninitialised-memory and use-after-free info
  # leaks. Costs a few percent on allocation-heavy workloads.
  "init_on_alloc=1",
  "init_on_free=1",

  # Do not merge slab caches of the same size. Makes heap overflows in one
  # cache harder to aim at objects of another type.
  "slab_nomerge",

  # Randomise the page allocator free lists and the kernel stack offset on
  # every system call, so heap and stack layouts are less predictable.
  "page_alloc.shuffle=1",
  "randomize_kstack_offset=on",

  # CPU side-channel mitigations on, and SMT off where SMT is a risk
  # (cross-thread leaks such as L1TF and MDS). nosmt halves logical CPUs on
  # x86 machines with hyperthreading.
  "mitigations=auto,nosmt",

  # No debugfs at all: it exposes kernel internals and has a long history of
  # bugs. Breaks some tracing tools.
  "debugfs=off",

  # Use the IOMMU strictly: flush the IOTLB synchronously on unmap and never
  # pass devices through untranslated. Stops DMA from a malicious or
  # compromised device reading arbitrary memory. iommu.* is the generic
  # (arm64 and x86) spelling; x86-only vendor switches are in 20-x86_64.toml.
  "iommu.strict=1",
  "iommu.passthrough=0",
  "efi=disable_early_pci_dma",

  # Start auditing before auditd runs, and give the kernel a large enough
  # backlog that early boot events are not dropped.
  "audit=1",
  "audit_backlog_limit=8192",

  # Linux Security Modules, stated explicitly so a changed kernel default
  # cannot silently drop one. This is the CentOS Stream 10 kernel's own
  # CONFIG_LSM list: lockdown (needed for lockdown= above), yama (ptrace
  # scope), integrity (IMA/EVM), selinux, bpf (used by systemd's
  # RestrictFileSystems= and friends) and landlock (unprivileged
  # self-sandboxing).
  "lsm=lockdown,yama,integrity,selinux,bpf,landlock",

  # Don't let a userspace process trust the CPU's RDRAND alone for early
  # entropy; mix it with other sources.
  "random.trust_cpu=off",
  "random.trust_bootloader=off",
]
