# Kernel modules this machine never needs. "blacklist" only stops automatic
# loading by alias; "install <mod> /bin/false" also makes an explicit
# `modprobe <mod>` fail, which is what stops an attacker (or a crafted file
# system image, or a socket() call that triggers autoload) from pulling in
# rarely used, poorly reviewed kernel code.

# Uncommon file systems. Mounting a crafted image of any of these has led to
# kernel memory corruption. erofs and overlay are NOT listed: composefs needs
# them to mount /usr.
install cramfs /bin/false
install freevxfs /bin/false
install hfs /bin/false
install hfsplus /bin/false
install jffs2 /bin/false
install udf /bin/false
install squashfs /bin/false
install gfs2 /bin/false
install f2fs /bin/false
install nilfs2 /bin/false
install ksmbd /bin/false

# Uncommon network protocols, reachable from unprivileged socket() calls.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n-hdlc /bin/false
install ax25 /bin/false
install netrom /bin/false
install x25 /bin/false
install rose /bin/false
install decnet /bin/false
install econet /bin/false
install af_802154 /bin/false
install ipx /bin/false
install appletalk /bin/false
install psnap /bin/false
install p8023 /bin/false
install p8022 /bin/false
install can /bin/false
install atm /bin/false
install l2tp_core /bin/false

# DMA-capable external buses: FireWire and Thunderbolt let a plugged-in
# device read memory. Bluetooth is a radio attack surface.
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
install thunderbolt /bin/false
install bluetooth /bin/false
install btusb /bin/false

# USB mass storage: data exfiltration and malicious file systems. USBGuard
# also blocks unknown devices; this is the second layer.
install usb-storage /bin/false
install uas /bin/false

# Test and legacy drivers with a history of bugs.
install vivid /bin/false
install floppy /bin/false
install pcspkr /bin/false
