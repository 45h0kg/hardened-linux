# Keep the journal on disk across reboots (evidence survives a reboot),
# compressed, size-capped, and forwarded to rsyslog for remote shipping.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=1G
ForwardToSyslog=yes
# Seal=yes only takes effect after `journalctl --setup-keys`, which must be
# run on the deployed machine (the verification key must leave the host).
Seal=yes
