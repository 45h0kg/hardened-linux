# Template: forward all logs to a central server over TLS, with a disk
# queue so nothing is lost while the server is unreachable. Copy to
# /etc/rsyslog.d/90-remote.conf, set the target and CA, and restart rsyslog.
#
# Why remote: an attacker who becomes root can edit or delete local logs
# (the audit rules make that loud, but not impossible). Lines already sent
# to another machine are out of their reach.
global(
  DefaultNetstreamDriver="gtls"
  DefaultNetstreamDriverCAFile="/etc/pki/rsyslog/ca.pem"
)
action(
  type="omfwd"
  target="logs.example.internal" port="6514" protocol="tcp"
  StreamDriver="gtls" StreamDriverMode="1"
  StreamDriverAuthMode="x509/name"
  StreamDriverPermittedPeers="logs.example.internal"
  queue.type="LinkedList" queue.filename="fwd_remote"
  queue.maxDiskSpace="1g" queue.saveOnShutdown="on"
  action.resumeRetryCount="-1"
)
